name: Joyflow Mechanical Checks

on:
  pull_request:
  push:
    branches:
      - "agent/**"

permissions:
  contents: read

jobs:
  semantic-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate committed semantic artifacts
        run: python scripts/validate_semantic_closure.py

      - name: Refresh generated execution artifacts
        run: bash scripts/refresh_runtime.sh

      - name: Compile Python sources
        run: python -m compileall -q scripts

      - name: Run Joyflow checks and counterexamples
        run: bash tests/run_checks.sh

      - name: Verify closure remains blocked before user acceptance
        run: |
          if python scripts/reconcile.py; then
            echo "Reconcile unexpectedly became closure-ready before user acceptance"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("observer/reconcile_result.json").read_text(encoding="utf-8"))
          assert result["closure_ready"] is False
          assert result["brain_semantic_review_passed"] is True
          assert result["user_acceptance_passed"] is False
          assert any("user acceptance" in item.lower() for item in result["blocking_items"])
          print("JOYFLOW_PRE_ACCEPTANCE_BLOCK_CONFIRMED")
          PY

      - name: Upload generated evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-semantic-artifacts
          path: |
            runtime/codex_interpretation_request.md
            runtime/routing_result.json
            runtime/execution_bridge_package.json
            runtime/context_palace.md
            runtime/codex_task_packet.md
            runtime/codex_launch_manifest.json
            subject/task_state.json
            observer/raw_check_results.json
            observer/reconcile_result.json
          if-no-files-found: error

      - name: Print generated artifact diff for review
        if: always()
        run: |
          git diff -- runtime/routing_result.json runtime/execution_bridge_package.json runtime/context_palace.md runtime/codex_task_packet.md runtime/codex_launch_manifest.json subject/task_state.json observer/raw_check_results.json observer/reconcile_result.json || true
