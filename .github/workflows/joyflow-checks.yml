name: Joyflow Mechanical Checks

on:
  pull_request:
  push:
    branches:
      - "agent/**"

permissions:
  contents: read

jobs:
  semantic-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate committed semantic artifacts
        run: python scripts/validate_semantic_closure.py

      - name: Build read-only interpretation request
        run: python scripts/build_codex_interpretation_request.py

      - name: Refresh generated execution artifacts
        run: |
          python scripts/route_task.py
          python scripts/build_bridge.py
          python scripts/build_context_palace.py
          python scripts/build_codex_packet.py

      - name: Compile Python sources
        run: python -m compileall -q scripts

      - name: Run Joyflow checks
        run: bash tests/run_checks.sh

      - name: Print generated artifact diff for review
        if: always()
        run: |
          git diff -- runtime/routing_result.json runtime/execution_bridge_package.json runtime/context_palace.md runtime/codex_task_packet.md runtime/codex_launch_manifest.json subject/task_state.json observer/raw_check_results.json || true
