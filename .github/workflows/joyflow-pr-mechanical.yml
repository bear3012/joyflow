name: Joyflow PR mechanical gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  current-object-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Joyflow validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt
      - name: Materialize current PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/joyflow-pr-body.md"
      - name: Verify exact current Joyflow object chain
        run: >-
          python tools/joyflow_repo_check.py verify-current-pr
          --repository .
          --pr-body-file "$RUNNER_TEMP/joyflow-pr-body.md"
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --pr-number "${{ github.event.pull_request.number }}"
