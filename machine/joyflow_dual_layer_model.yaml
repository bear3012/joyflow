- id: INV_PHASE1_STAGE_PARENT_PACKAGE_EXACT
  text: Each Phase 1 stage candidate binds the exact passed parent package name, byte count and SHA-256 before adding the
    next target increment.
  implementation: tools/validate_package.py::verify_stage_lineage
- id: INV_PR_CURRENT_BASE_ANCESTOR
  text: PR CI rejects any approved Base that is not an ancestor of the current reviewed Head.
  implementation: runtime/joyflow_phase1_review.py::validate_pr_record
- id: INV_PR_EXACT_SEALED_SOURCE_CHAIN
  text: PR review binds the exact current Projection, Codex Return, Evidence Bundle, Brain Review Capsule and final path decision.
  implementation: runtime/joyflow_phase1_review.py::validate_pr_record
- id: INV_PR_CI_SOURCE_OBSERVATION_ONLY
  text: The public PR CI entry replays the exact current repository chain and leaves the source repository unchanged.
  implementation: runtime/joyflow_phase1_review.py::build_pr_ci_result
- id: INV_MERGE_FREEZE_EXACT_REVIEW_CHAIN
  text: The merge candidate freeze consumes the exact current PR body, PR record, CI result, Projection, Return, Evidence
    Bundle and Brain Review Capsule.
  implementation: runtime/joyflow_phase1_merge.py::validate_merge_candidate_freeze
- id: INV_POST_FREEZE_USER_ACCEPTANCE_EXACT_SOURCE
  text: Applicable user acceptance occurs after the exact Merge Candidate Freeze and the acceptance Capsule binds that exact freeze; a bare Brain-owned acceptance status cannot substitute the user decision.
  implementation: runtime/joyflow_phase1_merge.py::validate_post_freeze_user_acceptance
- id: INV_MERGED_CHANGE_PROJECTION_EXACT_CURRENT_SOURCE
  text: The AI-native merged change projection binds the exact current PR, complete Diff path set, Projection, Return, Evidence
    Bundle, Codex block and Brain Review Capsule.
  implementation: runtime/joyflow_phase1_projection.py::validate_merged_change_projection
- id: INV_MERGED_CHANGE_PROJECTION_NAVIGATION_ONLY
  text: The merged change projection supports retrieval and context recovery but cannot substitute current repository, Diff,
    tests or source evidence.
  implementation: runtime/joyflow_phase1_projection.py::validate_merged_change_projection
- id: INV_PR_CI_EXACT_CURRENT_REVIEW_CHAIN_ONLY
  text: The public PR CI validates the exact current PR/review execution chain and does not require a navigation-only merged change projection before merge.
  implementation: runtime/joyflow_phase1_review.py::validate_pr_record
- id: INV_MERGE_FREEZE_BEFORE_USER_DECISIONS
  text: Brain Review PASS plus current PR CI PASS freezes the exact merge candidate before any applicable User Acceptance or final merge authorization is recorded; repository USER_ACCEPTANCE and MERGE_DECISION Capsules must carry that freeze binding.
  implementation: validate_repository_acceptance_freeze_binding
- id: INV_USER_MERGE_AUTHORIZATION_EXACT_FREEZE_AND_ACCEPTANCE
  text: Final merge authorization is an explicit USER decision bound to the exact Merge Candidate Freeze and the independently recorded post-freeze User Acceptance disposition when applicable.
  implementation: runtime/joyflow_dual_layer.py::validate_user_merge_authorization
- id: INV_COMPLETION_POINTER_EXACT_FREEZE_AUTHORIZATION_CHAIN
  text: A completion pointer consumes the exact Merge Candidate Freeze, post-freeze User Acceptance and USER final merge authorization, then records only the observed repository merge result.
  implementation: runtime/joyflow_dual_layer.py::validate_completion_pointer
- id: INV_UNIFIED_EXAMPLE_GENERATION_CURRENT_MODEL
  text: All base and stage-specific examples are regenerated from the same current Model and generator chain before package
    validation.
  implementation: tools/generate_all_examples.py::main
- id: INV_MIGRATION_EVIDENCE_STRENGTH_BOUNDARY
  text: Structural presence and source consistency cannot be promoted to behaviorally verified migration evidence.
  implementation: tools/generate_old_rule_migration.py::validate_migration_rows
- id: INV_MIGRATION_PER_TARGET_BEHAVIOR_COVERAGE
  text: Every target of a behaviorally verified migration has current behavior-level evidence that explicitly covers that
    target.
  implementation: tools/generate_old_rule_migration.py::validate_migration_rows
- id: INV_CANDIDATE_CAPABILITY_CLAIM_BOUNDARY
  text: Candidate capability status cannot exceed the strength of current verification references or self-assign independent
    review, release, baseline, merge or Promotion.
  implementation: tools/generate_old_rule_migration.py::validate_capability_status
- id: INV_CURRENT_CANDIDATE_DOCUMENT_IDENTITY
  text: Active package documents and bootloader identify the exact current candidate; parent identities appear only in explicit
    lineage context.
  implementation: tools/validate_package.py::verify_current_candidate_documents
- id: INV_LEGACY_SOURCE_IDENTITY_SET_BOUND
  text: Every legacy migration binds exact source identity; unavailable text is not replayed evidence.
  implementation: tools/generate_old_rule_migration.py::validate_brain_mapping
- id: INV_BRAIN_OWNED_LEGACY_SEMANTIC_MAPPING
  text: Semantic relations are supplied by a separately sealed WEB_BRAIN object.
  implementation: tools/generate_old_rule_migration.py::load_bound_inputs
- id: INV_LEGACY_EQUIVALENCE_COMPOSITE_GATE
  text: Equivalence requires exact legacy text, confirmed Brain mapping and per-target behavior evidence.
  implementation: tools/generate_old_rule_migration.py::validate_migration_rows
- id: INV_CAPABILITY_CLAIM_SUBJECT_REGISTRY
  text: Capability claims exactly match registered subjects and refs.
  implementation: tools/generate_old_rule_migration.py::validate_capability_status
- id: INV_LEGACY_MIGRATION_SCHEMA_CLOSURE
  text: Legacy source, Brain mapping, migration rows, evidence registry and capability claims pass strict current Schemas
    before semantic validation.
  implementation: tools/validate_migration_claims.py::main
- id: INV_LEGACY_DISPOSITION_SEPARATE_FROM_MAPPING
  text: Legacy semantic mapping cannot author defer, retire or carry-forward disposition decisions.
  implementation: tools/generate_old_rule_migration.py::validate_brain_mapping
- id: INV_SEALED_PER_RULE_DISPOSITION_DECISIONS
  text: Every legacy row consumes one separately sealed Web-Brain or user-owned disposition decision.
  implementation: tools/generate_old_rule_migration.py::validate_disposition_decisions
- id: INV_DERIVED_CURRENT_TARGET_BEHAVIOR_STATUS
  text: Current-target behavior status and verified/unverified target sets are recomputed from per-target behavior evidence.
  implementation: tools/generate_old_rule_migration.py::validate_migration_rows
- id: INV_LEGACY_EQUIVALENCE_AXIS_SEPARATE
  text: Unresolved legacy semantic equivalence is recorded separately from current-target behavior evidence.
  implementation: tools/generate_old_rule_migration.py::validate_migration_rows
- id: INV_PHASE_EFFECT_SEPARATE_FROM_SEMANTIC_STATE
  text: Phase effect is mechanically derived from the exact disposition decision and cannot rewrite semantic evidence state.
  implementation: tools/generate_old_rule_migration.py::validate_migration_rows
- id: INV_CAPABILITY_STATUS_NAVIGATION_ONLY
  text: CAPABILITY_STATUS is a generated non-authoritative navigation view and cannot satisfy any Stage or Phase Gate.
  implementation: tools/generate_old_rule_migration.py::validate_capability_status
- id: INV_CAPABILITY_VERIFICATION_CONTRACT_DIGEST
  text: Capability evidence refs bind exact verification contracts, including concrete refs and allowed capability subjects.
  implementation: tools/generate_old_rule_migration.py::validate_capability_claim_registry
